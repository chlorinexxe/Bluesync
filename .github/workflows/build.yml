name: Build BlueSync

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP/this project needs JDK 21 - a newer default JDK on the runner makes Gradle's
      # jlink step fail.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # debug.keystore is committed to the repo (see .gitignore) precisely so every build -
      # local or CI - signs with the same key; nothing to generate here.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bluesync-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluesync-debug-${{ github.sha }}
          path: bluesync-debug.apk
          if-no-files-found: error

      # GitHub always zips build artifacts when downloaded from the web UI, which is easy to
      # mistake for an installable file on a phone. A release asset downloads as the raw .apk
      # instead - update one rolling "latest" release so there's always a single stable link
      # that installs directly with no unzip step.
      - name: Publish latest build as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Automatically built from ${{ github.sha }}. Download bluesync-debug.apk and install it directly - no need to unzip anything."
          files: bluesync-debug.apk
